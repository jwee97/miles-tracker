name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The dashboard has its own dependency tree; build it so a broken PWA
      # fails here rather than in a Cloudflare build.
      - run: npm --prefix web ci
      - run: npm --prefix web run build
