name = "miles-tracker"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Bundle the SQL files as text so the Worker can bring its own database up to
# date via /migrate, instead of needing a CLI that a browser IDE cannot run.
[[rules]]
type = "Text"
globs = ["**/*.sql"]

# Three daily jobs. Cron expressions are ALWAYS UTC — Cloudflare does not convert
# them. Defaults below are tuned for SGT (UTC+8):
#   "0 22 * * *" -> 06:00 SGT  new promos + transfer-rate changes
#   "30 1 * * *" -> 09:30 SGT  spend digest and threshold alerts
#   "0 6 * * *"  -> 14:00 SGT  second promo scan, for offers posted during the day
# The two scan times must match SCAN_CRONS in src/index.ts; anything else there
# runs the digest instead.
[triggers]
crons = ["0 22 * * *", "30 1 * * *", "0 6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "miles"
database_id = "0084a099-e90c-4dc1-a88f-9792ac4093ab"

# The PWA is served by this same Worker, so there is one origin, one deploy,
# and no CORS. Navigation requests get index.html without invoking the Worker;
# run_worker_first forces the API and webhook paths through the script
# regardless of what headers the caller sends.
# Workers Logs. Free, 200,000 events a day and three days of retention, which
# this app uses a fraction of — and without it the Settings panel can count
# exceptions but never say what they were.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/tg", "/api/*", "/health"]

[vars]
# Minutes east of UTC for your local time. 480 = SGT/HKT. -300 = US Eastern (EST).
TZ_OFFSET_MINUTES = "480"
# Utilization thresholds (percent) that trigger an alert, highest last.
UTIL_THRESHOLDS = "50,80,90"
# Warn this many days before a minimum-spend deadline.
MIN_SPEND_WARN_DAYS = "7"
# How long a purchase can take to post. Spend this close to a window's end,
# with no confirmed posting date, is reported as at risk of landing in the
# next window instead of counting toward this one.
POSTING_LAG_DAYS = "3"
# Re-check a conversion's terms after this many days. Fees and ratios move
# often enough that a figure this old should not be trusted silently.
RATE_RECHECK_DAYS = "90"
# What one mile is worth to you, in cents. This is the exchange rate that lets
# a cashback card and a miles card be compared on the same scale. 1.5 is a
# common working figure for KrisFlyer redeemed on premium cabins; use less if
# you redeem for economy.
MILE_VALUE_CENTS = "1.5"
# Keep scanned feed items in full for this many days. After that the nightly
# job compacts judged ones: the id stays, so an item is never shown to you
# twice, but its excerpt, matched terms and offer link are dropped. 0 disables.
FEED_RETENTION_DAYS = "180"
# Whether spend on an excluded merchant code counts toward a minimum. Most
# issuers exclude the same codes from both, so the default leaves it out and
# reports the amount separately.
MIN_SPEND_COUNTS_EXCLUDED = "false"
# How far back a scan looks: month (the current calendar month), 7d, 30d, ytd
# or all. Blog category pages list years of posts; anything older than the
# window is recorded once so it is never re-read, and never pushed at you.
SCAN_WINDOW = "month"
# Delete an offer this many days after its end date passes. 0 keeps them.
OFFER_RETENTION_DAYS = "90"
# What the card recommendation optimises for: miles, cashback, balanced (by
# dollar value), or minspend (clear an unmet minimum before anything else).
OBJECTIVE = "balanced"
# Below this gain in cents, splitting a payment across two cards is not worth
# suggesting: two taps at the till for a few cents is noise, not advice.
SPLIT_MIN_GAIN_CENTS = "150"
# Which search provider promotion discovery uses: "brave" today. This belongs
# here rather than in Settings, because the key that goes with it is a secret
# and the two have to match. Leave it empty to switch search discovery off —
# feeds keep working, and the app reports search as "not configured" rather
# than pretending it is healthy.
SEARCH_PROVIDER = "brave"
# How many searches a day discovery may spend. Search is the only component
# that costs real money, so the cap is explicit and checked before anything
# runs.
MAX_SEARCH_QUERIES_PER_DAY = "15"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_SECRET      random string; Telegram echoes it on every webhook call
#   OWNER_CHAT_ID        your numeric Telegram chat id (the bot tells you on /start)
#   APP_SECRET           random string used to sign PWA magic-link tokens
#   SEARCH_API_KEY       optional; enables search discovery alongside the feeds.
#                        Must match SEARCH_PROVIDER above. Without it the app
#                        reports search as not configured and carries on with
#                        feeds alone.
#   CF_API_TOKEN         optional; lets Settings show what Cloudflare's own
#                        meters say this app costs. One permission:
#                        Account -> Account Analytics -> Read. See SETUP.md.
#                        The account id, worker name and database id that go
#                        with it are ordinary settings, not secrets.
